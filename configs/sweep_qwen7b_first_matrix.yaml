sweep:
  name: qwen7b_first_matrix
  model_config: configs/model_qwen7b_4bit.yaml
  experiment_config: configs/experiment_qwen7b_cat_sanity_2k_4bit.yaml
  data_config: configs/data_qwen7b_cat_subliminal_2k.yaml
  train_config: configs/train_lora_qwen7b_3epochs.yaml
  eval_config: configs/eval_qwen7b_cat_sanity.yaml

  traits:
    - cat
    - dog
    - lion
  optional_traits:
    - owl
    - dolphin

  conditions:
    - base
    - neutral_numbers
    - subliminal_numbers

  dataset_size: 10000
  epochs: 10
  learning_rate: 2.0e-4
  lora_r: 8
  lora_alpha: 8
  lora_dropout: 0.0
  quantization: qlora_nf4
  generation_mode: greedy
  eval_after_each_epoch: true

  loss_modes:
    - all_tokens
    - divergence_only

  lora_layers:
    - all
    - [0]
    - [0, 1, 2]

  seeds:
    - 0
    - 1
    - 2
