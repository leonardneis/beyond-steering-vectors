training:
  train_file: data/filtered/subliminal_numbers_owl_filtered.jsonl
  output_dir: results/reproduction/student_lora
  max_seq_length: 256
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  logging_steps: 5
  save_steps: 50
  warmup_ratio: 0.03
  weight_decay: 0.0
  trainer_backend: auto
  report_to: none
  dry_run: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

