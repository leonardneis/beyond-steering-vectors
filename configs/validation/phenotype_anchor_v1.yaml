# Phenotype Anchor v1 (P1) execution manifest (implementation; the scientific contract is the preregistration
# research/phenotype_anchor_v1/PREREGISTRATION.md, DRAFT, not frozen). Nothing here may change a hypothesis, statistic,
# threshold, panel word, prompt set or seed role. Scientific runs refuse while ``contract.status`` is ``draft``.
schema_version: 1
experiment_id: qwen7b_phenotype_anchor_v1

contract:
  path: research/phenotype_anchor_v1
  status: draft  # set to frozen at the freeze (tag prereg/phenotype-anchor-v1); scientific runs refuse a draft
  prompt_manifest: research/phenotype_anchor_v1/prompts/anchor_prompts.jsonl
  prompt_manifest_sha256: 192cd88708eecdffb1b111a75293d218aeb4992019df08b9c7c2beaef83286d8

